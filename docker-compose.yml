services:
  openclaw-gateway:
    image: ${OPENCLAW_IMAGE:-openclaw:local}
    build: .
    env_file:
      - path: .env
        required: false
      - path: .env.prod
        required: false
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      TERM: xterm-256color
      # Pin container-side state, workspace, and config paths so host values written to
      # `.env` (used by Compose for the bind-mount source below) cannot leak
      # into runtime code that resolves these env vars inside the container.
      # Without this override, a macOS host path like /Users/<you>/.openclaw/...
      # imported from .env caused first-reply `mkdir '/Users'` EACCES failures
      # in Linux Docker (#77436).
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      OPENCLAW_ALLOW_INSECURE_PRIVATE_WS: ${OPENCLAW_ALLOW_INSECURE_PRIVATE_WS:-}
      # Empty means auto: Bonjour disables itself in detected containers.
      # Set 0 only on host/macvlan/mDNS-capable networks; set 1 to force off.
      OPENCLAW_DISABLE_BONJOUR: ${OPENCLAW_DISABLE_BONJOUR:-}
      # OpenTelemetry export is outbound OTLP/HTTP from the Gateway. Prometheus
      # uses the existing authenticated Gateway route; it does not need a port.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-}
      OTEL_SEMCONV_STABILITY_OPT_IN: ${OTEL_SEMCONV_STABILITY_OPT_IN:-}
      OPENCLAW_OTEL_PRELOADED: ${OPENCLAW_OTEL_PRELOADED:-}
      KNOWLEDGEFORGE_API_URL: ${KNOWLEDGEFORGE_API_URL:-http://host.docker.internal:8742/api/v1}
      ADB_SERVER_SOCKET: ${ADB_SERVER_SOCKET:-tcp:100.122.125.15:5037}
      ANDROID_SERIAL: ${ANDROID_SERIAL:-emulator-5570}
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY:-}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY:-}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      TZ: ${OPENCLAW_TZ:-UTC}
    volumes:
      - ${OPENCLAW_CONFIG_DIR:-${HOME:-/tmp}/.openclaw}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR:-${HOME:-/tmp}/.openclaw/workspace}:/home/node/.openclaw/workspace
      - ${OPENCLAW_AUTH_PROFILE_SECRET_DIR:-${HOME:-/tmp}/.openclaw-auth-profile-secrets}:/home/node/.config/openclaw
      - /home/bsdev/Obsidian/config/vaults/bsdev:/home/node/obsidian-vault
      - /home/bsdev/Bsclawdbot/extensions/knowledgeforge-rag:/app/extensions/knowledgeforge-rag:ro
      - /home/bsdev/openclaw-claude:/home/node/.claude
      - ${OPENCLAW_WORKSPACE_DIR}/extensions/telegram-mtproto:/app/extensions/telegram-mtproto
      - /home/bsdev/Android/Sdk/platform-tools/adb:/usr/local/bin/adb:ro
      - /home/bsdev/BS/bsdeals:/home/node/.openclaw/workspace/projects/bsdeals
      - /home/bsdev/BS/bs_alert_bot:/home/node/.openclaw/workspace/projects/bs_alert_bot
      - /home/bsdev/BS/AndroidSynchApp:/home/node/.openclaw/workspace/projects/AndroidSynchApp
      - /home/bsdev/BS/bsemulatorcontroler:/home/node/.openclaw/workspace/projects/bsemulatorcontroler
      - /home/bsdev/BS/bsgangmoves:/home/node/.openclaw/workspace/projects/bsgangmoves
      - /home/bsdev/BS/bsgangranking:/home/node/.openclaw/workspace/projects/bsgangranking
      - /home/bsdev/BS/Bshome:/home/node/.openclaw/workspace/projects/Bshome
      - /home/bsdev/BS/BShotline:/home/node/.openclaw/workspace/projects/BShotline
      - /home/bsdev/BS/bskillcount:/home/node/.openclaw/workspace/projects/bskillcount
      - /home/bsdev/BS/bslauncher:/home/node/.openclaw/workspace/projects/bslauncher
      - /home/bsdev/BS/bssentrylistenner:/home/node/.openclaw/workspace/projects/bssentrylistenner
      - /home/bsdev/BS/bstimer:/home/node/.openclaw/workspace/projects/bstimer
      - /home/bsdev/BS/bsviewer:/home/node/.openclaw/workspace/projects/bsviewer
      - /home/bsdev/BS/bsvmadminbot:/home/node/.openclaw/workspace/projects/bsvmadminbot
      - /home/bsdev/Markdown-viewer:/home/node/.openclaw/workspace/projects/Markdown-viewer
      - /home/bsdev/pchelper:/home/node/.openclaw/workspace/projects/pchelper
      - /home/bsdev/BS/Remote-Sync:/home/node/.openclaw/workspace/projects/Remote-Sync
      - /home/bsdev/BS/SentryOG:/home/node/.openclaw/workspace/projects/SentryOG
      - /home/bsdev/tailscaledash:/home/node/.openclaw/workspace/projects/tailscaledash
      ## Uncomment the lines below to enable sandbox isolation
      ## (agents.defaults.sandbox). Requires Docker CLI in the image
      ## (build with --build-arg OPENCLAW_INSTALL_DOCKER_CLI=1) or use
      ## scripts/docker/setup.sh with OPENCLAW_SANDBOX=1 for automated setup.
      ## Set DOCKER_GID to the host's docker group GID (run: stat -c '%g' /var/run/docker.sock).
      # - /var/run/docker.sock:/var/run/docker.sock
    # group_add:
    #   - "${DOCKER_GID:-999}"
    # Let bundled local-model providers reach host-side LM Studio/Ollama via
    # http://host.docker.internal:<port>. Docker Desktop usually provides this
    # alias; the host-gateway mapping makes it work on Linux Docker Engine too.
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${OPENCLAW_GATEWAY_PORT:-18789}:18789"
      - "127.0.0.1:${OPENCLAW_BRIDGE_PORT:-18790}:18790"
    init: true
    restart: unless-stopped
    networks:
      - default
    command:
      [
        "node",
        "--disable-warning=ExperimentalWarning",
        "openclaw.mjs",
        "gateway",
        "--bind",
        "${OPENCLAW_GATEWAY_BIND:-lan}",
        "--port",
        "18789",
        "--allow-unconfigured",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:18789/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  openclaw-cli:
    image: ${OPENCLAW_IMAGE:-openclaw:local}
    network_mode: "service:openclaw-gateway"
    env_file:
      - path: .env
        required: false
      - path: .env.prod
        required: false
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      TERM: xterm-256color
      # Pin container-side state, workspace, and config paths so host values written to
      # `.env` cannot leak into runtime code via the env_file import (#77436).
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      OPENCLAW_ALLOW_INSECURE_PRIVATE_WS: ${OPENCLAW_ALLOW_INSECURE_PRIVATE_WS:-}
      KNOWLEDGEFORGE_API_URL: ${KNOWLEDGEFORGE_API_URL:-http://host.docker.internal:8742/api/v1}
      ADB_SERVER_SOCKET: ${ADB_SERVER_SOCKET:-tcp:100.122.125.15:5037}
      ANDROID_SERIAL: ${ANDROID_SERIAL:-emulator-5570}
      BROWSER: echo
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY:-}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY:-}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE:-}
      TZ: ${OPENCLAW_TZ:-UTC}
    volumes:
      - ${OPENCLAW_CONFIG_DIR:-${HOME:-/tmp}/.openclaw}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR:-${HOME:-/tmp}/.openclaw/workspace}:/home/node/.openclaw/workspace
      - ${OPENCLAW_AUTH_PROFILE_SECRET_DIR:-${HOME:-/tmp}/.openclaw-auth-profile-secrets}:/home/node/.config/openclaw
      - /home/bsdev/Obsidian/config/vaults/bsdev:/home/node/obsidian-vault
      - /home/bsdev/Bsclawdbot/extensions/knowledgeforge-rag:/app/extensions/knowledgeforge-rag:ro
      - /home/bsdev/openclaw-claude:/home/node/.claude
      - ${OPENCLAW_WORKSPACE_DIR}/extensions/telegram-mtproto:/app/extensions/telegram-mtproto
      - /home/bsdev/Android/Sdk/platform-tools/adb:/usr/local/bin/adb:ro
      - /home/bsdev/BS/bsdeals:/home/node/.openclaw/workspace/projects/bsdeals
      - /home/bsdev/BS/bs_alert_bot:/home/node/.openclaw/workspace/projects/bs_alert_bot
      - /home/bsdev/BS/AndroidSynchApp:/home/node/.openclaw/workspace/projects/AndroidSynchApp
      - /home/bsdev/BS/bsemulatorcontroler:/home/node/.openclaw/workspace/projects/bsemulatorcontroler
      - /home/bsdev/BS/bsgangmoves:/home/node/.openclaw/workspace/projects/bsgangmoves
      - /home/bsdev/BS/bsgangranking:/home/node/.openclaw/workspace/projects/bsgangranking
      - /home/bsdev/BS/Bshome:/home/node/.openclaw/workspace/projects/Bshome
      - /home/bsdev/BS/BShotline:/home/node/.openclaw/workspace/projects/BShotline
      - /home/bsdev/BS/bskillcount:/home/node/.openclaw/workspace/projects/bskillcount
      - /home/bsdev/BS/bslauncher:/home/node/.openclaw/workspace/projects/bslauncher
      - /home/bsdev/BS/bssentrylistenner:/home/node/.openclaw/workspace/projects/bssentrylistenner
      - /home/bsdev/BS/bstimer:/home/node/.openclaw/workspace/projects/bstimer
      - /home/bsdev/BS/bsviewer:/home/node/.openclaw/workspace/projects/bsviewer
      - /home/bsdev/BS/bsvmadminbot:/home/node/.openclaw/workspace/projects/bsvmadminbot
      - /home/bsdev/Markdown-viewer:/home/node/.openclaw/workspace/projects/Markdown-viewer
      - /home/bsdev/pchelper:/home/node/.openclaw/workspace/projects/pchelper
      - /home/bsdev/BS/Remote-Sync:/home/node/.openclaw/workspace/projects/Remote-Sync
      - /home/bsdev/BS/SentryOG:/home/node/.openclaw/workspace/projects/SentryOG
      - /home/bsdev/tailscaledash:/home/node/.openclaw/workspace/projects/tailscaledash
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "dist/index.js"]
    depends_on:
      - openclaw-gateway
